<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffcf4a" />
  <meta name="description" content="KapiBoom — мультяшный кликер с прокачкой, кейсами, квестами и мини-событиями." />
  <title>KapiBoom — кликер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span>KB</span><div><b>KapiBoom</b><small>click • upgrade • loot</small></div></div>
      <div class="wallet">
        <div><small>Монеты</small><b id="coins">0</b></div>
        <div><small>Алмазы</small><b id="gems">0</b></div>
        <div><small>Уровень</small><b id="level">1</b></div>
      </div>
      <button class="round" id="resetBtn" title="Сбросить прогресс">↺</button>
    </header>

    <section class="hero">
      <aside class="panel quest-panel">
        <p class="eyebrow">Квест</p>
        <h2 id="questTitle">Загрузка...</h2>
        <div class="progress"><i id="questFill"></i></div>
        <p id="questText"></p>
        <button class="secondary" id="claimQuest">Забрать награду</button>
      </aside>

      <section class="click-zone">
        <div class="levelbar"><i id="xpFill"></i></div>
        <div class="combo" id="combo">Комбо x1</div>
        <button class="capy" id="capy" aria-label="Кликнуть капибару">
          <span class="ears"></span><span class="face"><i></i><i></i><b></b></span>
        </button>
        <p class="tap-hint">Жми на капибару. Быстрые клики дают комбо, уровни и алмазы.</p>
        <button class="primary rush" id="rushBtn">⚡ Бум-режим</button>
      </section>

      <aside class="panel boss-panel" id="bossPanel">
        <p class="eyebrow">Рейд</p>
        <h2 id="bossName">Плюшевый босс</h2>
        <div class="progress boss"><i id="bossFill"></i></div>
        <p id="bossText">Появится на 5 уровне.</p>
        <button class="danger" id="bossHit">Атаковать</button>
      </aside>
    </section>

    <section class="tabs">
      <button class="active" data-tab="upgrades">Прокачка</button>
      <button data-tab="cases">Кейсы</button>
      <button data-tab="skins">Скины</button>
      <button data-tab="stats">Статы</button>
    </section>

    <section class="panel content" id="content"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
